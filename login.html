<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityEye - Login</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>

<body>



<nav class="navbar navbar-expand-lg navbar-dark city-navbar">

    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center"
           href="index.html"
           aria-label="CityEye Home">

            <img src="photo/logo.png"
                 alt="CityEye Logo"
                 width="60"
                 height="60">

        </a>



        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="map.html">
                        Map
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="reports.html">
                        Reports
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About the Team
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="halloffame.html">
                        Hall of Fame
                    </a>
                </li>

            </ul>


            <div class="d-flex flex-column flex-lg-row gap-2">

                <a href="login.html"
                   class="btn btn-outline-light active"
                   aria-current="page">
                    Log in
                </a>

                <a href="report.html"
                   class="btn btn-primary">
                    Report a problem
                </a>

            </div>

        </div>

    </div>

</nav>



<main>

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-sm-12 col-md-8 col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-4">
                            Login
                        </h1>


                        <form>

                            <div class="mb-3">

                                <label for="email"
                                       class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="Enter your email"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="password"
                                       class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       required>

                            </div>


                            <div class="form-check mb-3">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="remember">

                                <label class="form-check-label"
                                       for="remember">
                                    Remember me
                                </label>

                            </div>

                            <div class="d-grid">

                                <button type="submit"
                                        class="btn btn-primary btn-lg">
                                    Enter
                                </button>

                            </div>


                            <p class="text-center mt-4 mb-0">

                                Don't have an account?

                                <a href="register.html">
                                    Register here
                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>



<footer class="city-footer text-center py-4">

    <div class="container">

        <p class="mb-0">
            Team members: Arsen Sagidanov, Alisher Balyasnyy
        </p>

    </div>

</footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
