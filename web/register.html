<!-- ================= REGISTER FORM ================= -->

<main>

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-sm-12 col-md-10 col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-4">
                            Create an Account
                        </h1>


                        <form>

                            <!-- Name and Surname -->

                            <div class="row g-3">

                                <div class="col-sm-12 col-md-6">

                                    <label for="name"
                                           class="form-label">
                                        Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="name"
                                           name="name"
                                           placeholder="Enter your name"
                                           required>

                                </div>


                                <div class="col-sm-12 col-md-6">

                                    <label for="surname"
                                           class="form-label">
                                        Surname
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="surname"
                                           name="surname"
                                           placeholder="Enter your surname"
                                           required>

                                </div>


                                <!-- Email -->

                                <div class="col-12">

                                    <label for="email"
                                           class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="example@email.com"
                                           required>

                                </div>


                                <!-- City -->

                                <div class="col-sm-12 col-md-6">

                                    <label for="city"
                                           class="form-label">
                                        City
                                    </label>

                                    <select class="form-select"
                                            id="city"
                                            name="city"
                                            required>

                                        <option value="" selected disabled>
                                            Choose your city
                                        </option>

                                        <option value="astana">
                                            Astana
                                        </option>

                                        <option value="almaty">
                                            Almaty
                                        </option>

                                        <option value="shymkent">
                                            Shymkent
                                        </option>

                                        <option value="karaganda">
                                            Karaganda
                                        </option>

                                    </select>

                                </div>


                                <!-- Phone -->

                                <div class="col-sm-12 col-md-6">

                                    <label for="phone"
                                           class="form-label">
                                        Phone Number
                                    </label>

                                    <input type="tel"
                                           class="form-control"
                                           id="phone"
                                           name="phone"
                                           placeholder="+7 700 000 00 00">

                                </div>


                                <!-- Date of Birth -->

                                <div class="col-sm-12 col-md-6">

                                    <label for="date"
                                           class="form-label">
                                        Date of Birth
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           id="date"
                                           name="date">

                                </div>


                                <!-- Gender -->

                                <div class="col-sm-12 col-md-6">

                                    <label for="gender"
                                           class="form-label">
                                        Gender
                                    </label>

                                    <select class="form-select"
                                            id="gender"
                                            name="gender">

                                        <option value="" selected disabled>
                                            Choose gender
                                        </option>

                                        <option value="male">
                                            Male
                                        </option>

                                        <option value="female">
                                            Female
                                        </option>

                                        <option value="other">
                                            Other
                                        </option>

                                    </select>

                                </div>


                                <!-- Password -->

                                <div class="col-12">

                                    <label for="password"
                                           class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="password"
                                           name="password"
                                           placeholder="Create a password"
                                           required>

                                </div>


                                <!-- Terms -->

                                <div class="col-12">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="terms"
                                               required>

                                        <label class="form-check-label"
                                               for="terms">

                                            I agree to the terms and conditions.

                                        </label>

                                    </div>

                                </div>


                                <!-- Submit -->

                                <div class="col-12">

                                    <div class="d-grid">

                                        <button type="submit"
                                                class="btn btn-primary btn-lg">
                                            Register
                                        </button>

                                    </div>

                                </div>

                            </div>


                            <!-- Login link -->

                            <p class="text-center mt-4 mb-0">

                                Already have an account?

                                <a href="login.html">
                                    Login here
                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>
