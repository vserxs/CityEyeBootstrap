<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityEye - Report a Problem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark city-navbar">

    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center"
           href="index.html"
           aria-label="CityEye Home">

            <img src="photo/logo.png"
                 alt="CityEye Logo"
                 width="60"
                 height="60">

        </a>



        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="map.html">
                        Map
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="reports.html">
                        Reports
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About the Team
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="halloffame.html">
                        Hall of Fame
                    </a>
                </li>

            </ul>


            <div class="d-flex flex-column flex-lg-row gap-2">

                <a href="login.html"
                   class="btn btn-outline-light">
                    Log in
                </a>

                <a href="report.html"
                   class="btn btn-primary active"
                   aria-current="page">
                    Report a problem
                </a>

            </div>

        </div>

    </div>

</nav>



<main>

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-sm-12 col-md-10 col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-2">
                            Report a Problem
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Help make your city better by reporting a problem.
                        </p>


                        <form>


                            <div class="mb-3">

                                <label for="problemType"
                                       class="form-label">
                                    Problem Type
                                </label>

                                <select class="form-select"
                                        id="problemType"
                                        name="problemType"
                                        required>

                                    <option value="" selected disabled>
                                        Select a problem
                                    </option>

                                    <option value="pothole">
                                        Pothole
                                    </option>

                                    <option value="streetlight">
                                        Broken Streetlight
                                    </option>

                                    <option value="garbage">
                                        Garbage
                                    </option>

                                    <option value="traffic">
                                        Traffic Problem
                                    </option>

                                    <option value="other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <div class="mb-3">

                                <label for="description"
                                       class="form-label">
                                    Description
                                </label>

                                <textarea class="form-control"
                                          id="description"
                                          name="description"
                                          rows="5"
                                          placeholder="Describe the problem..."
                                          required></textarea>

                            </div>



                            <div class="mb-3">

                                <label for="location"
                                       class="form-label">
                                    Location
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        📍
                                    </span>

                                    <input type="text"
                                           class="form-control"
                                           id="location"
                                           name="location"
                                           placeholder="Enter the location"
                                           required>

                                </div>

                            </div>


                            <div class="mb-4">

                                <label for="image"
                                       class="form-label">
                                    Upload a Photo
                                </label>

                                <input type="file"
                                       class="form-control"
                                       id="image"
                                       name="image"
                                       accept="image/*">

                                <div class="form-text">
                                    You can upload an image of the problem.
                                </div>

                            </div>



                            <fieldset class="mb-4">

                                <legend class="fs-6 fw-semibold">
                                    Problem Priority
                                </legend>


                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="priority"
                                           id="low"
                                           value="low">

                                    <label class="form-check-label"
                                           for="low">
                                        Low
                                    </label>

                                </div>


                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="priority"
                                           id="medium"
                                           value="medium"
                                           checked>

                                    <label class="form-check-label"
                                           for="medium">
                                        Medium
                                    </label>

                                </div>


                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="priority"
                                           id="high"
                                           value="high">

                                    <label class="form-check-label"
                                           for="high">
                                        High
                                    </label>

                                </div>

                            </fieldset>


                            <div class="form-check mb-4">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="contact">

                                <label class="form-check-label"
                                       for="contact">
                                    I agree to be contacted about this report.
                                </label>

                            </div>


                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">

                                <button type="reset"
                                        class="btn btn-outline-secondary btn-lg">
                                    Clear
                                </button>

                                <button type="submit"
                                        class="btn btn-primary btn-lg">
                                    Submit Report
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<footer class="city-footer text-center py-4">

    <div class="container">

        <p class="mb-0">
            Team members: Arsen Sagidanov, Alisher Balyasnyy
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
